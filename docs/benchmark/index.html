  const high = Math.max(activeMetric.parity, ...values);
  const step = niceStep(Math.max(high - low, activeMetric.parity === 1 ? 0.05 : 5), 4);
  return { min: Math.floor(low / step) * step, max: Math.ceil(high / step) * step, step };
}

const tooltip = document.getElementById("tooltip");

function showTooltip(anchor, view, operation, point) {
  tooltip.replaceChildren();
  const heading = document.createElement("div");
  heading.className = "heading";
  heading.textContent = `${view.name} · ${operation.title} · ${point.rows.toLocaleString("en-US")} rows`;
  tooltip.appendChild(heading);
  for (const dimension of operation.dimensions) {
    const line = document.createElement("div");
    line.className = "row";
    const key = document.createElement("span");
    key.className = "line-key";
    key.style.background = `var(${DIMENSIONS[dimension].series})`;
    const value = document.createElement("span");
    value.className = "value";
    value.textContent = activeMetric.format(activeMetric.fromRatio(point.ratio(operation.key, dimension)));
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = DIMENSIONS[dimension].label;
    const detail = document.createElement("span");
    detail.className = "detail";
    detail.textContent = point.detail(operation.key, dimension);
    line.append(key, value, name, detail);
    tooltip.appendChild(line);
  }
  tooltip.style.display = "block";
  const box = tooltip.getBoundingClientRect();
  const left = anchor.x + 16 + box.width > window.innerWidth ? anchor.x - box.width - 16 : anchor.x + 16;
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, Math.min(window.innerHeight - box.height - 8, anchor.y - box.height / 2)) + "px";
}

const hideTooltip = () => { tooltip.style.display = "none"; };

function bestPoint(points, operation, dimension) {
  return points.reduce((best, point) => {
    const value = activeMetric.fromRatio(point.ratio(operation.key, dimension));
    const bestValue = activeMetric.fromRatio(best.ratio(operation.key, dimension));
    return (activeMetric.higherIsBetter ? value > bestValue : value < bestValue) ? point : best;
  });
}

function renderChart(container, view, operation, domain) {
  const points = view.points;
  const height = 220;
  const margin = { top: 12, right: 44, bottom: 42, left: 52 };

  const card = document.createElement("section");
  card.className = "card";
  const title = document.createElement("h3");
  title.textContent = operation.title;
  const legend = document.createElement("ul");
  legend.className = "legend";
  for (const dimension of operation.dimensions) {
    const best = bestPoint(points, operation, dimension);
    const item = document.createElement("li");
    const key = document.createElement("span");
    key.className = "key";
    key.style.background = `var(${DIMENSIONS[dimension].series})`;
    const label = document.createElement("span");
    label.textContent = DIMENSIONS[dimension].label;
    const note = document.createElement("span");
    note.className = "best";
    note.textContent = `· best ${activeMetric.format(activeMetric.fromRatio(best.ratio(operation.key, dimension)))} at ${rowsLabel(best.rows)}`;
    item.append(key, label, note);
    legend.appendChild(item);
  }
  card.append(title, legend);
  container.appendChild(card);
  return () => drawChart(card, view, operation, domain);
}

function drawChart(card, view, operation, domain) {
  const points = view.points;
  const height = 220;
  const margin = { top: 12, right: 44, bottom: 42, left: 52 };
  const width = Math.max(260, card.clientWidth - 32);
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const logMin = Math.log10(points[0].rows);
  const logMax = Math.log10(points[points.length - 1].rows);
  const x = n => margin.left + (logMax === logMin ? plotWidth / 2 : (Math.log10(n) - logMin) / (logMax - logMin) * plotWidth);
  const y = v => margin.top + (domain.max - v) / (domain.max - domain.min) * plotHeight;

  const svg = el("svg", { width, height, viewBox: `0 0 ${width} ${height}`, tabindex: 0, role: "img",
    "aria-label": `${view.name}, ${operation.title}: ${metricLabel(activeMetric)} by rows per stream. `
      + "Use the left and right arrow keys to read each row count." }, card);

  for (let tick = domain.min; tick <= domain.max + domain.step / 1e6; tick += domain.step) {
    el("line", { x1: margin.left, x2: width - margin.right, y1: y(tick), y2: y(tick), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: margin.left - 8, y: y(tick) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = activeMetric.tick(tick);
  }
  for (let decade = 10 ** Math.ceil(logMin); decade <= points[points.length - 1].rows; decade *= 10) {
    el("text", { x: x(decade), y: height - margin.bottom + 18, "text-anchor": "middle", class: "tick" }, svg).textContent = rowsLabel(decade);
  }
  el("text", { x: margin.left + plotWidth / 2, y: height - 4, "text-anchor": "middle", class: "axis-title" }, svg)
    .textContent = "Rows per stream (log scale)";

  el("line", { x1: margin.left, x2: width - margin.right, y1: y(activeMetric.parity), y2: y(activeMetric.parity),
    stroke: "var(--reference)", "stroke-width": 1 }, svg);
  el("text", { x: width - margin.right + 6, y: y(activeMetric.parity) + 4, class: "reference-label" }, svg).textContent = activeBaseline.name;

  const crosshair = el("line", { y1: margin.top, y2: margin.top + plotHeight, stroke: "var(--baseline)",
    "stroke-width": 1, visibility: "hidden" }, svg);

  for (const dimension of operation.dimensions) {
    const coordinates = points.map(point =>
      [x(point.rows), y(activeMetric.fromRatio(point.ratio(operation.key, dimension)))]);
    el("path", { d: coordinates.map((c, index) => (index ? "L" : "M") + c.join(",")).join(""),
      fill: "none", stroke: `var(${DIMENSIONS[dimension].series})`, "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    for (const [cx, cy] of coordinates) {
      el("circle", { cx, cy, r: 4, fill: `var(${DIMENSIONS[dimension].series})`, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    }
  }

  let active = -1;
  function select(index) {
    active = index;
    const px = x(points[index].rows);
    crosshair.setAttribute("x1", px);
    crosshair.setAttribute("x2", px);
    crosshair.setAttribute("visibility", "visible");
    const box = svg.getBoundingClientRect();
    showTooltip({ x: box.left + px, y: box.top + margin.top + plotHeight / 2 }, view, operation, points[index]);
  }
  function clear() {
    active = -1;
    crosshair.setAttribute("visibility", "hidden");
    hideTooltip();
  }
  const hit = el("rect", { x: margin.left - 12, y: margin.top, width: plotWidth + 24, height: plotHeight, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", event => {
    const px = event.clientX - svg.getBoundingClientRect().left;
    let nearest = 0;
    points.forEach((point, index) => {
      if (Math.abs(x(point.rows) - px) < Math.abs(x(points[nearest].rows) - px)) nearest = index;
    });
    if (nearest !== active) select(nearest);
  });
  hit.addEventListener("pointerleave", clear);
  svg.addEventListener("keydown", event => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    const step = event.key === "ArrowRight" ? 1 : -1;
    const start = active < 0 ? (step > 0 ? -1 : points.length) : active;
    select(Math.min(points.length - 1, Math.max(0, start + step)));
  });
  svg.addEventListener("blur", clear);
}

function table(headings, rows) {
  const node = document.createElement("table");
  const head = node.createTHead().insertRow();
  for (const heading of headings) {
    const cell = document.createElement("th");
    cell.textContent = heading;
    head.appendChild(cell);
  }
  const body = node.createTBody();
  for (const values of rows) {
    const tr = body.insertRow();
    for (const value of values) tr.insertCell().textContent = value;
  }
  return node;
}

function rootTable(view) {
  return table(["Rows", "Dimension", "Iterations", activeBaseline.name, "JSVRO", ...METRICS.map(metricLabel)],
    view.points.flatMap(point => SERIES.map(({ operation, dimension, label }) => {
      const { base, jsvro } = point.amounts(operation.key, dimension);
      const unit = DIMENSIONS[dimension].unit;
      return [point.rows.toLocaleString("en-US"), label, point.iterations.toLocaleString("en-US"),
        formatAmount(base, unit), formatAmount(jsvro, unit), ...METRICS.map(m => m.format(m.fromRatio(jsvro / base)))];
    })));
}

function summaryTable(view) {
  const names = view.points[0].perRoot.map(entry => entry.name);
  return table(["Rows", "Dimension", ...names, "Combined"],
    view.points.flatMap(point => SERIES.map(({ operation, dimension, label }) => [
      point.rows.toLocaleString("en-US"), label,
      ...point.perRoot.map(entry => activeMetric.format(activeMetric.fromRatio(entry.point.ratio(operation.key, dimension)))),
      activeMetric.format(activeMetric.fromRatio(point.ratio(operation.key, dimension)))])));
}

const ROOTS = buildRoots();
const SUMMARY = buildSummary(ROOTS);
const VIEWS = [SUMMARY, ...ROOTS];
let activeView = SUMMARY;
let activeMetric = METRICS[0];
let tableOpen = false;

function renderPage() {
  const container = document.getElementById("page");
  const open = container.querySelector("details");
  if (open) tableOpen = open.open;
  container.replaceChildren();
  document.getElementById("title").textContent = activeBaseline.title;
  document.title = activeBaseline.title;
  document.getElementById("subtitle").textContent = activeBaseline.subtitle;
  document.getElementById("metric-help").textContent = activeMetric.help(activeBaseline.name);
  document.querySelectorAll("#metrics button").forEach((button, index) => {
    button.textContent = metricLabel(METRICS[index]);
  });

  const page = document.createElement("section");
  page.className = "page";
  const heading = document.createElement("h2");
  heading.textContent = activeView.name;
  const description = document.createElement("p");
  description.textContent = activeView.description;
  const grid = document.createElement("div");
  grid.className = "grid";
  page.append(heading, description, grid);
  container.appendChild(page);

  const draws = OPERATIONS.map(operation => {
    const values = VIEWS.flatMap(view => view.points.flatMap(point =>
      operation.dimensions.map(dimension => activeMetric.fromRatio(point.ratio(operation.key, dimension)))));
    return renderChart(grid, activeView, operation, domainFor(values));
  });
  draws.forEach(draw => draw());

  const details = document.createElement("details");
  details.open = tableOpen;
  const summary = document.createElement("summary");
  summary.textContent = activeView === SUMMARY
    ? `Table view (${metricLabel(activeMetric).toLowerCase()} per aggregate root and combined)`
    : "Table view";
  details.append(summary, activeView === SUMMARY ? summaryTable(activeView) : rootTable(activeView));
  page.appendChild(details);
}

function metricLabel(metric) {
  return metric.key === "throughput" ? `Throughput vs ${activeBaseline.name}` : metric.label;
}

function segmented(containerId, options, isActive, onSelect) {
  const group = document.getElementById(containerId);
  const buttons = options.map(option => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = option.label ?? option.name;
    button.setAttribute("aria-pressed", String(isActive(option)));
    button.addEventListener("click", () => {
      buttons.forEach(other => other.setAttribute("aria-pressed", String(other === button)));
      onSelect(option);
      renderPage();
    });
    group.appendChild(button);
    return button;
  });
}

segmented("baselines", BASELINES, baseline => baseline === activeBaseline, baseline => { activeBaseline = baseline; });
segmented("pages", VIEWS, view => view === activeView, view => { activeView = view; });
segmented("metrics", METRICS, metric => metric === activeMetric, metric => { activeMetric = metric; });
renderPage();
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderPage, 150);
});
document.getElementById("note").textContent =
  `Run ${DATA.generatedAt} on Java ${DATA.javaVersion} with ${DATA.cpuCount} CPUs. `
  + "Time is the median wall-clock time per operation. CPU is the whole process's CPU time per operation, averaged "
  + "over the measured runs, so it includes garbage collection and JIT threads; at the smallest row counts an "
  + "operation takes microseconds and those background threads dominate, so CPU readings there are unreliable. Memory is the median bytes allocated "
  + "per operation on the benchmark thread; encoding writes to a counting stream so output buffers are not counted. "
  + "Avro is measured as an object container file without compression, using classes generated from Avro schemas; "
  + "mapping between the benchmark objects and the generated classes is included in encode and decode, as it would be "
  + "in an application. Chart scales are shared between the summary and every aggregate root, per chart type and "
  + "baseline.";
</script>
</body>
</html>
